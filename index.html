<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Coffe bar</title>
</head>

<body>
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar section-content">

            <a href="#" class="nav-logo">
                <h2 class="nav-text">☕ Coffee Bar</h2>
            </a>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Sobre</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>
                <li class="nav-item">''
                    <a href="#" class="nav-link">Avaliação</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Galeria</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contato</a>
                </li>

            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">The best Coffee</h2>
                    <h3 class="subtitle">Welcome to Coffee Corner!</h3>
                    <p class="description">Enjoy a warm and inviting experience with our selection of fresh coffee,
                        delicious pastries, and cozy atmosphere.
                    </p>

                    <div class="buttons">
                        <a href="#" class="button order-now">Order Now</a>
                        <a href="#" class="button contact-us">Contact Us</a>
                    </div>
                    
                </div>
                <div class="hero-image-wrapper">
                    <img src="img/coffee-principal.png" alt="hero" class="hero-img">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
